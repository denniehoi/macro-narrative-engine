name: Dagelijkse run

on:
  schedule:
    # De vaste ochtendrun start Supabase (pg_cron, 05:17 UTC) via de functie trigger-run.
    # Deze GitHub-tijdstippen zijn reserve: GitHub start ze soms uren te laat of helemaal niet.
    # Ze slaan over zodra de run van vandaag gelukt is (--skip-if-done).
    - cron: "17 5 * * *"   # 06:17 winter / 07:17 zomer
    - cron: "47 6 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Rundatum JJJJ-MM-DD (leeg = vandaag)"
        required: false
      skip_if_done:
        description: "Overslaan als vandaag al een geslaagde run is (gebruikt door de planning in Supabase)"
        required: false
        default: "false"

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pipeline
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAY: ${{ inputs.day }}
          EVENT: ${{ github.event_name }}
          SKIP: ${{ inputs.skip_if_done }}
        run: |
          if [ -n "$DAY" ]; then python -m engine run --day "$DAY"
          elif [ "$EVENT" = "schedule" ] || [ "$SKIP" = "true" ]; then python -m engine run --skip-if-done
          else python -m engine run; fi
